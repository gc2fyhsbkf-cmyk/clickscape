<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Clickscape</title>
  <meta name="description" content="An idle clicker adventure: mine, smelt, smith, fish, farm, dig and fight your way to level 99.">
  <meta name="theme-color" content="#2b241a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Clickscape">
  <link rel="manifest" href="manifest.webmanifest?v=12.10">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css?v=12.10">
</head>
<body>
  <div id="splash" style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:radial-gradient(circle at 50% 40%,#1c2638,#0b0f17 70%);color:#e8c070;font:600 15px Georgia,serif;letter-spacing:1px">
    <img src="art/ui/logo.webp" alt="Clickscape" style="width:min(70vw,420px);height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.6))">
    <div style="width:min(50vw,240px);height:6px;border-radius:4px;background:#0a0e15;border:1px solid #000;overflow:hidden"><i style="display:block;height:100%;width:40%;background:linear-gradient(#ffe08a,#d89a20);animation:splashbar 1.1s ease-in-out infinite alternate"></i></div>
    <span>Loading…</span>
    <style>@keyframes splashbar{from{transform:translateX(-60%)}to{transform:translateX(210%)}}</style>
  </div>
  <header id="top">
    <div class="brand">Click<span>scape</span> <small style="font-size:.55rem;color:#b0a083;font-family:system-ui">v12.10</small></div>
    <div id="buffs"></div>
    <div class="purse"><span class="coin">🪙</span><span id="coins">0</span></div>
  </header>
  <main id="view"></main>
  <nav id="nav"></nav>
  <div id="feed" class="empty" data-act="openlog" aria-live="polite"></div>
  <div id="floaters"></div>
  <div id="modal" hidden></div>
  <script src="app.js?v=12.10"></script>
</body>
</html>
